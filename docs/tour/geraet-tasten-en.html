<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#1c1c1c;font-family:"DejaVu Sans",sans-serif}
</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030">
 <defs><style>
  .body{fill:#2a2a2a;stroke:#8a8a8a;stroke-width:3}
  .scr{fill:#111;stroke:#5a5a5a;stroke-width:3}
  .btn{fill:#1a1a1a;stroke:#9a9a9a;stroke-width:3}
  .lbl{fill:#bdbdbd;font-size:20px}
  .big{fill:#fff;font-size:30px;font-weight:bold}
  .txt{fill:#dddddd;font-size:24px}
 </style></defs>
 <!-- oberer Teil -->
 <rect class="body" x="300" y="40" width="600" height="400" rx="34"/>
 <rect class="scr" x="420" y="80" width="360" height="290" rx="10"/>
 <text class="lbl" x="600" y="232" text-anchor="middle">top screen</text>
 <!-- Scharnier -->
 <rect class="body" x="320" y="440" width="560" height="26" rx="8"/>
 <!-- unterer Teil -->
 <rect class="body" x="300" y="466" width="600" height="400" rx="34"/>
 <rect class="scr" x="430" y="490" width="340" height="270" rx="10"/>
 <text class="lbl" x="600" y="632" text-anchor="middle">bottom screen (touch)</text>
 <!-- Steuerkreuz -->
 <path class="btn" d="M352 520 h22 v22 h22 v22 h-22 v22 h-22 v-22 h-22 v-22 h22 z"/>
 <!-- Stick -->
 <circle class="btn" cx="363" cy="660" r="40"/><circle cx="363" cy="660" r="24" fill="#333" stroke="#9a9a9a" stroke-width="2"/>
 <!-- Anbernic + Home -->
 <circle cx="340" cy="790" r="20" fill="#1a1a1a" stroke="#e5383b" stroke-width="6"/>
 <circle cx="392" cy="790" r="20" fill="#1a1a1a" stroke="#3d7bff" stroke-width="6"/>
 <!-- Zurückpfeil auf der Home-Taste -->
 <path d="M386 783 h8 a8 8 0 0 1 0 16 h-10" fill="none" stroke="#ddd" stroke-width="3"/>
 <path d="M380 783 l8 -6 v12 z" fill="#ddd"/>
 <!-- ABXY -->
 <g class="lbl" text-anchor="middle" font-size="18">
  <circle class="btn" cx="840" cy="530" r="17"/><text x="840" y="536">X</text>
  <circle class="btn" cx="808" cy="562" r="17"/><text x="808" y="568">Y</text>
  <circle class="btn" cx="872" cy="562" r="17"/><text x="872" y="568">A</text>
  <circle class="btn" cx="840" cy="594" r="17"/><text x="840" y="600">B</text>
 </g>
 <!-- Start / Select -->
 <circle class="btn" cx="868" cy="740" r="12"/><text class="lbl" x="848" y="747" font-size="16" text-anchor="end">Start</text>
 <circle class="btn" cx="868" cy="785" r="12"/><text class="lbl" x="848" y="792" font-size="16" text-anchor="end">Select</text>
 <!-- Beschriftungen -->
 <path d="M340 810 V868" fill="none" stroke="#e5383b" stroke-width="4"/>
 <rect x="40" y="868" width="300" height="56" rx="16" fill="#e5383b"/>
 <text class="big" x="190" y="906" text-anchor="middle" font-size="26">Anbernic button</text>
 <text class="txt" x="40" y="960">short: Control Center</text>
 <path d="M392 810 V840 H600 V868" fill="none" stroke="#3d7bff" stroke-width="4"/>
 <rect x="440" y="868" width="330" height="56" rx="16" fill="#3d7bff"/>
 <text class="big" x="605" y="906" text-anchor="middle" font-size="26">Home button</text>
 <text class="txt" x="440" y="960">short: save, back to ES</text>
 <text class="txt" x="440" y="992">long (1.5 s): Game switcher</text>
</svg></body></html>
